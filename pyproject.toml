[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-job-queue"
version = "0.1.0"
description = "Lightweight, persistent SQLite-backed asynchronous priority task queue with worker pools, retries, and dead-letter queue (DLQ)."
readme = "README.md"
authors = [{ name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
